<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flipping-engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #16181d; --panel: #1e2127; --border: #2c313a;
    --text: #d7dae0; --dim: #8b919c; --accent: #e8b64c;
    --green: #7bc96f; --red: #e06c75;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 20px;
           border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; color: var(--accent); }
  header .fresh { color: var(--dim); font-size: 12px; margin-left: auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 20px;
              align-items: center; }
  .controls label { color: var(--dim); font-size: 12px; }
  .controls input[type=text] { width: 90px; background: var(--panel); color: var(--text);
              border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  .controls button { background: var(--accent); color: #1a1a1a; border: 0;
              border-radius: 6px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  .controls button.secondary { background: var(--panel); color: var(--text);
              border: 1px solid var(--border); }
  main { padding: 0 20px 40px; max-width: 1180px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; }
  th { color: var(--dim); font-size: 11px; text-transform: uppercase;
       letter-spacing: .05em; border-bottom: 1px solid var(--border);
       cursor: pointer; user-select: none; }
  td:first-child, th:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid #23262d; }
  tbody tr:hover { background: var(--panel); }
  td.item a { color: var(--text); text-decoration: none; font-weight: 600; }
  td.item a:hover { color: var(--accent); }
  .gp { color: var(--green); font-weight: 600; }
  .members-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                 background: var(--accent); margin-left: 6px; vertical-align: middle; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase;
       letter-spacing: .06em; margin: 26px 0 4px; }
  .rejected td { color: var(--dim); }
  .reason { color: var(--red); font-size: 12px; text-align: left !important; }
  #backtest-summary { background: var(--panel); border: 1px solid var(--border);
       border-radius: 8px; padding: 12px 16px; margin-top: 10px; font-size: 13px;
       color: var(--dim); display: none; }
  #backtest-summary b { color: var(--text); }
  .spin { color: var(--dim); padding: 30px; text-align: center; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 9px;
           letter-spacing: .04em; }
  .badge.buying { background: #2b3a2b; color: var(--green); }
  .badge.selling { background: #223146; color: #58a6ff; }
  .editable { cursor: pointer; border-bottom: 1px dashed var(--dim); }
  .editable:hover { color: var(--accent); }
  .act { background: var(--panel); color: var(--text); border: 1px solid var(--border);
         border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
  .act:hover { border-color: var(--accent); }
  .act.primary { background: var(--accent); color: #1a1a1a; border: 0; font-weight: 600; }
  .act.danger:hover { border-color: var(--red); color: var(--red); }
  .addflip { background: none; border: 1px solid var(--border); color: var(--green);
             border-radius: 5px; cursor: pointer; padding: 1px 8px; font-weight: 700; }
  .addflip:hover { border-color: var(--green); }
  #sessionStats { color: var(--dim); font-size: 12px; margin-left: 10px; }
  #sessionStats b { color: var(--green); }
  .addbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .addbar input { background: var(--panel); color: var(--text); border: 1px solid var(--border);
                  border-radius: 6px; padding: 6px 8px; }
  .done-profit { font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>flipping-engine</h1>
  <span style="color:var(--dim);font-size:12px">OSRS GE flip suggestions</span>
  <span class="fresh" id="freshness"></span>
</header>

<div class="controls">
  <label>Cash <input type="text" id="cash" value="10m"></label>
  <label>Min profit <input type="text" id="minProfit" value="0"></label>
  <label>Turnover
    <select id="maxRt" style="background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px">
      <option value="30">Quick (≤30 min)</option>
      <option value="60" selected>Active (≤1 h)</option>
      <option value="180">Relaxed (≤3 h)</option>
      <option value="">Any</option>
    </select>
  </label>
  <label><input type="checkbox" id="f2p"> F2P only</label>
  <button onclick="loadFlips()">Refresh</button>
  <script>document.addEventListener('DOMContentLoaded', () => $('maxRt').addEventListener('change', loadFlips));</script>
  <button class="secondary" onclick="runBacktest()" id="btBtn">Run backtest</button>
  <label style="margin-left:auto"><input type="checkbox" id="auto" checked> auto-refresh 60s</label>
</div>

<main>
  <h2 style="margin-top:14px">Active flips <span id="sessionStats"></span></h2>
  <div id="activeFlips" style="color:var(--dim)">—</div>
  <div class="addbar">
    <input type="text" id="itemSearch" list="itemOptions" placeholder="Add item to flip…" style="width:220px">
    <datalist id="itemOptions"></datalist>
    <button class="act" onclick="addManualFlip()">Add</button>
  </div>
  <div id="recentDone" style="margin-top:8px"></div>

  <h2>Suggestions</h2>
  <div id="flips" class="spin">Loading…</div>

  <h2>Rejected by stability check</h2>
  <div id="rejected" style="color:var(--dim)">—</div>

  <h2>Backtest</h2>
  <div id="backtest-summary"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const fmtGp = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(2) + 'b';
  if (a >= 1e6) return (n/1e6).toFixed(2) + 'm';
  if (a >= 1e4) return (n/1e3).toFixed(1) + 'k';
  return String(Math.round(n));
};
const wikiLink = id => `https://prices.runescape.wiki/osrs/item/${id}`;

let sortKey = 'gp_per_hour', sortDesc = true, lastRows = [];

function renderFlips(rows) {
  lastRows = rows;
  rows = [...rows].sort((a,b) => (sortDesc ? -1 : 1) * ((a[sortKey] ?? 0) - (b[sortKey] ?? 0)));
  const cols = [
    ['name','Item'], ['buy_price','Buy'], ['sell_price','Sell'], ['margin','Margin'],
    ['quantity','Qty'], ['est_profit','Profit'], ['roundtrip_minutes','RT (min)'],
    ['fill_rate','Fill %'], ['gp_per_hour','GP/hr'],
  ];
  let h = '<table><thead><tr>' + cols.map(([k,label]) =>
    `<th onclick="setSort('${k}')">${label}${k===sortKey ? (sortDesc?' ▾':' ▴') : ''}</th>`
  ).join('') + '<th></th></tr></thead><tbody>';
  for (const c of rows) {
    h += `<tr>
      <td class="item"><a href="${wikiLink(c.item_id)}" target="_blank">${c.name}</a>${c.members ? '<span class="members-dot" title="members"></span>' : ''}</td>
      <td>${fmtGp(c.buy_price)}</td><td>${fmtGp(c.sell_price)}</td>
      <td>${fmtGp(c.margin)}</td><td>${c.quantity.toLocaleString()}</td>
      <td class="gp">${fmtGp(c.est_profit)}</td>
      <td>${c.roundtrip_minutes.toFixed(0)}</td>
      <td>${c.fill_rate != null ? (c.fill_rate*100).toFixed(0)+'%' : '—'}</td>
      <td class="gp">${fmtGp(c.gp_per_hour)}</td>
      <td><button class="addflip" title="Track this flip"
        onclick="addFlip(${c.item_id}, ${c.quantity}, ${c.buy_price}, ${c.sell_price})">+</button></td></tr>`;
  }
  $('flips').innerHTML = h + '</tbody></table>';
}

function setSort(k) {
  sortDesc = (sortKey === k) ? !sortDesc : true;
  sortKey = k;
  renderFlips(lastRows);
}

async function loadFlips() {
  const params = new URLSearchParams({
    cash: $('cash').value, min_profit: $('minProfit').value,
    f2p: $('f2p').checked, limit: 30,
  });
  if ($('maxRt').value) params.set('max_rt', $('maxRt').value);
  try {
    const r = await fetch('/api/flips?' + params);
    const body = await r.json();
    renderFlips(body.passing);
    const rej = body.rejected;
    $('rejected').innerHTML = rej.length
      ? '<table><tbody>' + rej.map(c =>
          `<tr class="rejected"><td class="item" style="text-align:left">${c.name}</td>
           <td>${fmtGp(c.gp_per_hour)} gp/hr</td>
           <td class="reason">${c.stability.reason}</td></tr>`).join('') + '</tbody></table>'
      : '—';
    if (body.data_fetched_at) {
      const age = Math.round((Date.now()/1000 - body.data_fetched_at) / 60);
      $('freshness').textContent = `data ${age} min old`;
    }
  } catch (e) {
    $('flips').innerHTML = `<div class="spin">Failed to load: ${e}</div>`;
  }
}

async function runBacktest() {
  $('btBtn').disabled = true; $('btBtn').textContent = 'Running…';
  try {
    const r = await fetch('/api/backtest/run?cash=' + encodeURIComponent($('cash').value), {method:'POST'});
    showBacktest(await r.json());
  } finally {
    $('btBtn').disabled = false; $('btBtn').textContent = 'Run backtest';
  }
}

function showBacktest(s) {
  if (!s || s.error) return;
  const el = $('backtest-summary');
  el.style.display = 'block';
  const ratio = s.median_actual_vs_predicted_roundtrip;
  el.innerHTML =
    `<b>${s.total_simulations}</b> simulated flips across <b>${s.items_tested}</b> items ` +
    `(capture ${s.capture}) — fill rate <b>${(s.overall_fill_rate*100).toFixed(0)}%</b>` +
    (ratio ? `, actual roundtrips <b>${ratio.toFixed(1)}×</b> the engine's prediction` : '') +
    `<br>Top by simulated profit: ` +
    [...s.items].sort((a,b)=>b.total_profit-a.total_profit).slice(0,5)
      .map(i => `${i.name} (${fmtGp(i.total_profit)}, ${(i.fill_rate*100).toFixed(0)}% fill)`).join(' · ');
}

// ---------- active flips tracker ----------
const parseGp = s => {
  s = String(s).toLowerCase().replaceAll(',', '').trim();
  const mult = {k: 1e3, m: 1e6, b: 1e9}[s.slice(-1)];
  return Math.round(mult ? parseFloat(s.slice(0, -1)) * mult : parseFloat(s));
};

const api = (method, path, body) => fetch(path, {
  method, headers: {'Content-Type': 'application/json'},
  body: body ? JSON.stringify(body) : undefined,
}).then(r => r.json());

async function addFlip(itemId, qty, buy, sell) {
  await api('POST', '/api/active-flips',
    {item_id: itemId, quantity: qty, buy_price: buy, sell_price: sell});
  loadActiveFlips();
}

let searchResults = [];
async function searchItems(q) {
  if (q.length < 2) return;
  searchResults = await (await fetch('/api/items/search?q=' + encodeURIComponent(q))).json();
  $('itemOptions').innerHTML = searchResults.map(i => `<option value="${i.name}">`).join('');
}
$('itemSearch').addEventListener('input', e => searchItems(e.target.value));

async function addManualFlip() {
  const name = $('itemSearch').value;
  const item = searchResults.find(i => i.name === name);
  if (!item) { alert('Pick an item from the search results'); return; }
  const buy = prompt(`Buy price for ${item.name}?`);
  if (buy == null) return;
  const qty = prompt('Quantity?', item.buy_limit || 1);
  if (qty == null) return;
  await addFlip(item.id, parseGp(qty), parseGp(buy), null);
  $('itemSearch').value = '';
}

async function editField(id, field, current) {
  const label = {buy_price: 'Buy price', sell_price: 'Target sell price', quantity: 'Quantity'}[field];
  const v = prompt(label + '?', current ?? '');
  if (v == null || v === '') return;
  await api('PATCH', `/api/active-flips/${id}`, {[field]: parseGp(v)});
  loadActiveFlips();
}

async function markBought(id, targetPrice, qty) {
  const p = prompt('Actual buy price? (per item)', targetPrice);
  if (p == null) return;
  const q = prompt('Actual quantity bought?', qty);
  if (q == null) return;
  await api('POST', `/api/active-flips/${id}/bought`,
    {actual_price: parseGp(p), actual_quantity: parseGp(q)});
  loadActiveFlips();
}

async function markSold(id, suggested) {
  const p = prompt('Actual sell price? (per item)', suggested ?? '');
  if (p == null || p === '') return;
  const res = await api('POST', `/api/active-flips/${id}/sold`, {actual_price: parseGp(p)});
  if (res.profit != null) {
    $('sessionStats').innerHTML = `flip closed: <b>${fmtGp(res.profit)}</b> profit`;
  }
  loadActiveFlips();
}

async function removeFlip(id) {
  if (!confirm('Remove this flip?')) return;
  await api('DELETE', `/api/active-flips/${id}`);
  loadActiveFlips();
}

function profitColor(n) { return n >= 0 ? 'var(--green)' : 'var(--red)'; }

async function loadActiveFlips() {
  const d = await (await fetch('/api/active-flips')).json();
  const s = d.session;
  $('sessionStats').innerHTML =
    `24h: ${s.completed_24h} flips, <b style="color:${profitColor(s.profit_24h)}">${fmtGp(s.profit_24h)}</b> profit`;

  if (!d.active.length) {
    $('activeFlips').innerHTML = '— nothing tracked; use ＋ on a suggestion or search below';
  } else {
    let h = `<table><thead><tr><th style="text-align:left">Item</th><th>Status</th>
      <th>Qty</th><th>Buy</th><th>Target sell</th><th>Live low/high</th>
      <th>Sell now</th><th>Profit now</th><th style="text-align:left">Actions</th></tr></thead><tbody>`;
    for (const f of d.active) {
      const buying = f.status === 'buying';
      h += `<tr>
        <td class="item"><a href="${wikiLink(f.item_id)}" target="_blank">${f.name ?? f.item_id}</a></td>
        <td><span class="badge ${f.status}">${f.status.toUpperCase()}</span></td>
        <td><span class="editable" onclick="editField(${f.id},'quantity',${f.quantity})">${f.quantity.toLocaleString()}</span></td>
        <td><span class="editable" onclick="editField(${f.id},'buy_price',${f.buy_price})">${fmtGp(f.buy_price)}</span></td>
        <td><span class="editable" onclick="editField(${f.id},'sell_price',${f.sell_price ?? 'null'})">${f.sell_price ? fmtGp(f.sell_price) : 'set…'}</span></td>
        <td>${f.live_low ? fmtGp(f.live_low) : '—'} / ${f.live_high ? fmtGp(f.live_high) : '—'}</td>
        <td>${f.suggested_sell ? fmtGp(f.suggested_sell) : '—'}</td>
        <td style="color:${profitColor(f.profit_at_suggested ?? 0)}">${f.profit_at_suggested != null ? fmtGp(f.profit_at_suggested) : '—'}</td>
        <td style="text-align:left">` +
        (buying
          ? `<button class="act primary" onclick="markBought(${f.id},${f.buy_price},${f.quantity})">Bought</button>`
          : `<button class="act primary" onclick="markSold(${f.id},${f.suggested_sell})">Sold</button>`) +
        ` <button class="act danger" onclick="removeFlip(${f.id})">✕</button></td></tr>`;
    }
    $('activeFlips').innerHTML = h + '</tbody></table>';
  }

  $('recentDone').innerHTML = d.recent_done.length
    ? '<span style="color:var(--dim);font-size:12px">Recent: ' +
      d.recent_done.slice(0, 5).map(f =>
        `${f.name} <span class="done-profit" style="color:${profitColor(f.profit)}">${fmtGp(f.profit)}</span>`
      ).join(' · ') + '</span>'
    : '';
}

loadFlips();
loadActiveFlips();
fetch('/api/backtest/latest').then(r => r.ok ? r.json() : null).then(showBacktest);
setInterval(() => { if ($('auto').checked) { loadFlips(); loadActiveFlips(); } }, 60_000);
</script>
</body>
</html>
